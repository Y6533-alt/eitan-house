  <style>
    :root { --bg: #0c0e0d; --ink: #f1ede5; --muted: #a3a69f; }

    main { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    a { position: relative; display: flex; align-items: flex-end; min-height: 45vh; padding: 2rem 16px; color: #fff; text-decoration: none; overflow: hidden; }
    a img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.5); transition: transform .8s, filter .5s; }
    a:hover img { transform: scale(1.04); filter: brightness(.7); }
    a div { position: relative; }
    h2 { font-size: clamp(2rem, 5vw, 4rem); margin: 0 0 .4rem; font-weight: 700; }
    p { margin: 0; color: #ddd; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
